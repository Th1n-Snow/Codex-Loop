name: Build and publish Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-loop-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
      - name: Install build and test dependencies
        run: python -m pip install -c requirements-build.txt -e ".[build,test]"
      - name: Validate supported Windows features
        run: python scripts/verify-release.py
      - name: Build executable, Setup and licensed source packages
        shell: pwsh
        run: ./scripts/build-release-ci.ps1
      - name: Publish the current version once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from sentinel.product import PRODUCT; print(PRODUCT.version)"
          $tag = "v$version"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "$tag already exists; increment the version before publishing new binaries." }
          gh release create $tag --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Codex Loop $tag" --notes-file "docs/RELEASE_NOTES_$tag.md" dist/CodexLoop-Setup.exe dist/CodexLoop-Setup.exe.sha256 "dist/CodexLoop-$version-windows-x64.zip" "dist/CodexLoop-$version-source.zip" "dist/CodexLoop-$version-dependency-sources.zip" dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-files
          path: |
            dist/CodexLoop-Setup.exe
            dist/*.sha256
            dist/*.zip
            dist/SHA256SUMS.txt
            artifacts/release-checks
